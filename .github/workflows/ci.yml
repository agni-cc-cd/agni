name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Worker types
        run: npx cf workers types

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: npx --yes @commitlint/cli@19 --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
